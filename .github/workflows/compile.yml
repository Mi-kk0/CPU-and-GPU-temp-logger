name: Compile C Program

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Compile Code
        run: make

      - name: Upload Binary

        uses: actions/upload-artifact@v4
        with:
          name: temp_monitor_binary
          path: temp_monitor
